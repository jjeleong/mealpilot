services:
  postgres:
    image: postgres:16-alpine
    container_name: mealpilot-postgres
    environment:
      POSTGRES_DB: mealpilot
      POSTGRES_USER: mealpilot
      POSTGRES_PASSWORD: mealpilot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - mealpilot_pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/seed-recipes.sql:/docker-entrypoint-initdb.d/02-seed-recipes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealpilot -d mealpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mealpilot_pgdata:
