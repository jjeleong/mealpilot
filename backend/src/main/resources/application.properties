spring.application.name=mealpilot-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mealpilot}
spring.datasource.username=${DATABASE_USERNAME:mealpilot}
spring.datasource.password=${DATABASE_PASSWORD:mealpilot_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=false
spring.jackson.serialization.write-dates-as-timestamps=false
